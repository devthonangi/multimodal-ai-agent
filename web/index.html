<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ask one question about an image with a private local AI model.">
  <title>Local Vision</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #687083;
      --line: #dfe3ea;
      --soft: #f5f7fa;
      --accent: #176bff;
      --accent-dark: #0f55cf;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: #f7f8fa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .card {
      width: min(100%, 640px);
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: white;
      box-shadow: 0 18px 55px rgba(23, 32, 51, .08);
    }

    .header { margin-bottom: 30px; }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 38px); letter-spacing: -.04em; }
    .local {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #3e4758;
      font-size: 12px;
      white-space: nowrap;
    }
    .local::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #25a244; }
    .header p { margin: 9px 0 0; color: var(--muted); line-height: 1.5; }

    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }

    .file-picker {
      position: relative;
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px;
      border: 1px dashed #aeb6c3;
      border-radius: 14px;
      background: var(--soft);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .file-picker:hover, .file-picker.dragging { border-color: var(--accent); background: #f1f6ff; }
    .file-picker input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .file-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--accent);
      background: white;
      border: 1px solid var(--line);
      font-size: 21px;
    }
    .file-copy { min-width: 0; }
    .file-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }

    #question {
      width: 100%;
      min-height: 52px;
      padding: 14px 15px;
      border: 1px solid #bfc5cf;
      border-radius: 12px;
      color: var(--ink);
      background: white;
      outline: none;
    }
    #question:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23, 107, 255, .12); }

    #ask-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
    }
    #ask-button:hover:not(:disabled) { background: var(--accent-dark); }
    #ask-button:disabled { cursor: wait; opacity: .6; }

    .status { min-height: 18px; margin: 11px 2px 0; color: var(--muted); font-size: 12px; text-align: center; }

    .answer {
      display: none;
      margin-top: 26px;
      padding: 20px;
      border-radius: 14px;
      background: var(--soft);
    }
    .answer.visible { display: block; }
    .answer.error { color: var(--error); background: #fff3f2; }
    .answer h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .answer p { margin: 0; line-height: 1.6; white-space: pre-wrap; }

    @media (max-width: 480px) {
      body { padding: 12px; align-items: start; }
      .card { margin-top: 12px; padding: 24px 18px; border-radius: 16px; }
      .header-row { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="header-row">
        <h1>Ask an image</h1>
        <span class="local">Runs locally</span>
      </div>
      <p>Choose an image and ask one clear question.</p>
    </header>

    <form id="query-form">
      <div class="field">
        <label for="image">Image</label>
        <label class="file-picker" id="file-picker" for="image">
          <input id="image" type="file" accept="image/jpeg,image/png,image/webp" required>
          <span class="file-icon" aria-hidden="true">+</span>
          <span class="file-copy">
            <strong id="file-name">Choose an image</strong>
            <span id="file-help">JPEG, PNG, or WebP · up to 10 MB</span>
          </span>
        </label>
      </div>

      <div class="field">
        <label for="question">Question</label>
        <input id="question" maxlength="500" placeholder="What is in this image?" autocomplete="off" required>
      </div>

      <button id="ask-button" type="submit">Ask AI</button>
      <div class="status" id="status" role="status"></div>
    </form>

    <section class="answer" id="answer" aria-live="polite">
      <h2>Answer</h2>
      <p id="answer-text"></p>
    </section>
  </main>

  <script>
    const form = document.querySelector('#query-form');
    const fileInput = document.querySelector('#image');
    const filePicker = document.querySelector('#file-picker');
    const fileName = document.querySelector('#file-name');
    const fileHelp = document.querySelector('#file-help');
    const question = document.querySelector('#question');
    const askButton = document.querySelector('#ask-button');
    const status = document.querySelector('#status');
    const answer = document.querySelector('#answer');
    const answerText = document.querySelector('#answer-text');

    function selectFile(file) {
      if (!file) return;
      fileName.textContent = file.name;
      fileHelp.textContent = 'Selected · click to change';
      answer.className = 'answer';
      answerText.textContent = '';
      question.focus();
    }

    fileInput.addEventListener('change', () => selectFile(fileInput.files[0]));

    for (const name of ['dragenter', 'dragover']) {
      filePicker.addEventListener(name, event => {
        event.preventDefault();
        filePicker.classList.add('dragging');
      });
    }
    for (const name of ['dragleave', 'drop']) {
      filePicker.addEventListener(name, event => {
        event.preventDefault();
        filePicker.classList.remove('dragging');
      });
    }
    filePicker.addEventListener('drop', event => {
      const file = event.dataTransfer.files[0];
      if (!file) return;
      const transfer = new DataTransfer();
      transfer.items.add(file);
      fileInput.files = transfer.files;
      selectFile(file);
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const file = fileInput.files[0];
      const prompt = question.value.trim();
      if (!file || !prompt || askButton.disabled) return;

      askButton.disabled = true;
      askButton.textContent = 'Analyzing…';
      status.textContent = 'The local model is looking at your image.';
      answer.className = 'answer';

      const data = new FormData();
      data.append('image', file);
      data.append('question', prompt);

      try {
        const response = await fetch('/query', { method: 'POST', body: data });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || 'Unable to analyze this image.');
        answerText.textContent = payload.response;
        answer.className = 'answer visible';
        status.textContent = 'Answered privately on this device.';
      } catch (error) {
        answerText.textContent = error.message;
        answer.className = 'answer visible error';
        status.textContent = 'Please try again.';
      } finally {
        askButton.disabled = false;
        askButton.textContent = 'Ask AI';
      }
    });
  </script>
</body>
</html>
