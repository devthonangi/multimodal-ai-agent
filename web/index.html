<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Understand real-world scenes using NVIDIA Cosmos 3.">
  <title>Image Chat</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #66716a;
      --paper: #fffdf7;
      --line: #dfe5dc;
      --accent: #246b49;
      --accent-dark: #185138;
      --soft: #edf5ee;
      --error: #a83b32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, #dcefe0 0, transparent 30%),
        radial-gradient(circle at 85% 90%, #f2e8c9 0, transparent 32%),
        #f7f5ee;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(23, 33, 27, .1);
      border-radius: 28px;
      background: rgba(255, 253, 247, .94);
      box-shadow: 0 28px 80px rgba(44, 60, 48, .13);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 66px);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: .98;
    }

    .intro {
      max-width: 560px;
      margin: 18px 0 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    form { display: grid; gap: 18px; }

    .drop-zone {
      position: relative;
      min-height: 245px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px dashed #b9c7bb;
      border-radius: 20px;
      background: var(--soft);
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .2s;
    }

    .drop-zone:hover, .drop-zone.dragging {
      border-color: var(--accent);
      background: #e4f1e6;
      transform: translateY(-1px);
    }

    .drop-zone input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .upload-copy { padding: 28px; text-align: center; }
    .upload-copy strong { display: block; margin-bottom: 7px; font-size: 18px; }
    .upload-copy span { color: var(--muted); font-size: 14px; }

    #preview {
      width: 100%;
      height: 100%;
      max-height: 420px;
      display: none;
      object-fit: contain;
      background: #111;
    }

    label[for="question"] { font-size: 14px; font-weight: 750; }

    .question-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    #question {
      width: 100%;
      min-width: 0;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: white;
      font: inherit;
      outline: none;
    }

    #question:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(36, 107, 73, .12); }

    button {
      min-width: 118px;
      padding: 0 22px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: var(--accent);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .65; transform: none; }

    #result {
      display: none;
      padding: 20px;
      border-left: 4px solid var(--accent);
      border-radius: 4px 14px 14px 4px;
      background: #f3f7f2;
      line-height: 1.6;
    }

    #result.visible { display: block; }
    #result.error { border-color: var(--error); color: var(--error); background: #fff2f0; }
    .answer-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }

    .status { min-height: 20px; color: var(--muted); font-size: 13px; }

    @media (max-width: 580px) {
      main { padding: 25px 18px; border-radius: 20px; }
      .question-row { grid-template-columns: 1fr; }
      button { min-height: 50px; }
      .drop-zone { min-height: 205px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">NVIDIA Cosmos 3</p>
    <h1>Ask your image.</h1>
    <p class="intro">Choose a real-world scene and ask a question. Cosmos reasons about objects, space, motion, causality, and what may happen next.</p>

    <form id="query-form">
      <label class="drop-zone" id="drop-zone" for="image">
        <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
        <span class="upload-copy" id="upload-copy">
          <strong>Drop an image here</strong>
          <span>or click to choose · JPEG, PNG, or WebP</span>
        </span>
        <img id="preview" alt="Selected image preview">
      </label>

      <label for="question">What would you like to know?</label>
      <div class="question-row">
        <input id="question" name="question" value="What is in this image?" maxlength="500" required>
        <button id="ask-button" type="submit">Ask AI</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div id="result" role="region" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.querySelector('#query-form');
    const fileInput = document.querySelector('#image');
    const dropZone = document.querySelector('#drop-zone');
    const uploadCopy = document.querySelector('#upload-copy');
    const preview = document.querySelector('#preview');
    const question = document.querySelector('#question');
    const button = document.querySelector('#ask-button');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');

    function showPreview(file) {
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      uploadCopy.style.display = 'none';
      result.className = '';
      result.textContent = '';
    }

    fileInput.addEventListener('change', () => showPreview(fileInput.files[0]));

    for (const eventName of ['dragenter', 'dragover']) {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.add('dragging');
      });
    }

    for (const eventName of ['dragleave', 'drop']) {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.remove('dragging');
      });
    }

    dropZone.addEventListener('drop', event => {
      const file = event.dataTransfer.files[0];
      if (!file) return;
      const transfer = new DataTransfer();
      transfer.items.add(file);
      fileInput.files = transfer.files;
      showPreview(file);
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = 'Choose an image first.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Thinking…';
      status.textContent = 'The first answer may take a little longer while the model loads.';
      result.className = '';

      const data = new FormData();
      data.append('image', file);
      data.append('question', question.value);

      try {
        const response = await fetch('/query', { method: 'POST', body: data });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || 'The request failed.');
        result.innerHTML = '<span class="answer-label">Answer</span>';
        result.append(document.createTextNode(payload.response));
        result.className = 'visible';
        status.textContent = `Answered with ${payload.model}.`;
      } catch (error) {
        result.textContent = error.message;
        result.className = 'visible error';
        status.textContent = 'Please check that the AI service is ready and try again.';
      } finally {
        button.disabled = false;
        button.textContent = 'Ask AI';
      }
    });
  </script>
</body>
</html>
